name: Release

# Changesets opens a "Version packages" pull request as changesets land on main. Merging that
# pull request publishes to npm.
#
# Publishing uses npm trusted publishing (OIDC), so there is no npm token in this repository.
# It stays switched off until the npm organisation exists and each package lists this workflow
# as its trusted publisher. To switch it on, set the repository variable NPM_PUBLISH to "true".

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'cadence-clinical/cadence'
    permissions:
      contents: write # push the version commit and tags
      pull-requests: write # open the "Version packages" pull request
      id-token: write # npm trusted publishing and provenance
      actions: write # start CI on the version pull request (see the last step)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: pnpm version-packages
          publish-script: ${{ vars.NPM_PUBLISH == 'true' && 'pnpm release' || '' }}
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub does not start workflows for a pull request opened with the built-in token, so the
      # version pull request would never receive its required check and could never merge.
      # A manual dispatch is the one event that token may raise. The runs report against the
      # branch's head commit, which is what the required check reads.
      - name: Run the checks on the version pull request
        if: steps.changesets.outputs.pr-number != ''
        run: |
          gh workflow run ci.yml --ref changeset-release/main
          gh workflow run chromatic.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
