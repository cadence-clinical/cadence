name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # Raised by the Release workflow for the version pull request. See release.yml.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build
      - name: Component grades are backed by what they claim
        run: pnpm check:grades
      - name: Published packages resolve for consumers
        run: pnpm check:packages
      - name: Changes to a published package carry a changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  components:
    name: Component tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cadence-clinical/storybook exec playwright install --with-deps ${{ matrix.browser }}
      - name: Every story renders, passes its interactions and passes axe
        run: pnpm turbo run test:browser
        env:
          CADENCE_BROWSERS: ${{ matrix.browser }}

  site:
    name: Site smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cadence-clinical/site exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@cadence-clinical/site
      - run: pnpm --filter @cadence-clinical/site test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: site-playwright-report
          path: apps/site/playwright-report
          retention-days: 7

  # One required check for branch protection, so the rule does not change when jobs do.
  ci-ok:
    name: CI passed
    if: always()
    needs: [verify, components, site]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
